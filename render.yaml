# Render Blueprint for TourFlow's backend. Deploys as 6 free web services:
# - tourflow-core: gateway + identity + catalog + booking + payment, bundled
#   into one deployable (see backend/deploy/core) so there's exactly one
#   cold start instead of 5 chained ones. Keep this one warm during the hours
#   you need it (see backend/deploy/README.md section 7).
# - tourflow-mobility, tourflow-engagement, tourflow-platform,
#   tourflow-insights, tourflow-search: lower-traffic services, deployed
#   standalone and left to free-tier-sleep independently.
#
# Postgres is NOT deployed here -- free Render services can't accept inbound
# private-network connections, so the standalone services couldn't reach a
# data store living inside tourflow-core. Neon (Postgres) is external. Redis
# is not used by any service today, so it isn't provisioned at all. Kafka is
# deferred (Upstash discontinued theirs in 2025) -- see the deployment
# README's Phase 2.
#
# SECRETS DO NOT LIVE IN THIS FILE. Render ignores `sync: false` (and
# `generateValue`) inside env groups, so the group below only holds
# non-secret constants. After applying the Blueprint, open Env Groups ->
# tourflow-shared in the dashboard and add by hand: DB_HOST, DB_NAME,
# DB_USERNAME, DB_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS (Render keeps
# variables added in the dashboard even though they're not listed here).
# Service-level `sync: false` values below are prompted for during the
# Blueprint's initial creation flow.

envVarGroups:
  - name: tourflow-shared
    envVars:
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
      - key: DB_CHANNEL_BINDING
        value: require
      # The direct Neon endpoint has a real connection cap; 9 JVMs x Hikari's
      # default pool of 10 would blow through it.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "3"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"

services:
  - type: web
    name: tourflow-core
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerContext: .
    dockerfilePath: deploy/core/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: tourflow-shared
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - type: web
    name: tourflow-mobility
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerContext: .
    dockerfilePath: deploy/mobility-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: tourflow-shared

  - type: web
    name: tourflow-engagement
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerContext: .
    dockerfilePath: deploy/engagement-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: tourflow-shared

  - type: web
    name: tourflow-platform
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerContext: .
    dockerfilePath: deploy/platform-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: tourflow-shared

  - type: web
    name: tourflow-insights
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerContext: .
    dockerfilePath: deploy/insights-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: tourflow-shared

  - type: web
    name: tourflow-search
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerContext: .
    dockerfilePath: deploy/search-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: tourflow-shared
      # Phase 1 (no Kafka yet): the Elasticsearch index is only filled from
      # Kafka tour.events, so search would return nothing -- "catalog" filters
      # catalog-service's tour list in memory instead. In Phase 2, change to
      # "elasticsearch" and add ELASTICSEARCH_URIS + SPRING_ELASTICSEARCH_APIKEY
      # by hand in the dashboard.
      - key: SEARCH_BACKEND
        value: catalog
      # Elastic Cloud serverless doesn't support the _cluster/health call
      # Spring's Elasticsearch health indicator makes (HTTP 410), and in
      # catalog mode there's no Elasticsearch at all -- either way the
      # indicator would leave /actuator/health permanently DOWN and Render
      # restart-looping this service.
      - key: MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED
        value: "false"
      # tourflow-core's public URL, e.g. https://tourflow-core.onrender.com
      - key: CATALOG_SERVICE_URL
        sync: false
