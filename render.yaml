# Render Blueprint for TourFlow backend: 10 free web services -- the API gateway
# plus the 9 domain services, each its own service (measured: the 5 JVMs of
# gateway+identity+catalog+booking+payment need ~1 GB together, far over the
# free plan 512 MB, so they cannot share one instance).
#
# Free services cannot RECEIVE private-network traffic, so every service
# reaches the others through their PUBLIC onrender.com URLs. Those URLs are
# the *_SERVICE_URL values in the env group below: they assume each service
# name is free on Render (URL = https://<name>.onrender.com). If Render
# appended a suffix to any name, fix that value in the dashboard.
#
# Postgres is external (Neon, DIRECT endpoint). Redis is not used by any
# service. Kafka is deferred (see backend/deploy/README.md, Phase 2).
#
# SECRETS DO NOT LIVE IN THIS FILE. Render ignores sync: false (and
# generateValue) inside env groups, so the group only holds constants and
# URLs. After applying, open Env Groups -> tourflow-shared and add by hand:
# DB_HOST, DB_NAME, DB_USERNAME, DB_PASSWORD, JWT_SECRET,
# CORS_ALLOWED_ORIGINS. Service-level sync: false values (Razorpay, on
# tourflow-payment) are prompted for during the Blueprint creation flow.

envVarGroups:
  - name: tourflow-shared
    envVars:
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
      - key: DB_CHANNEL_BINDING
        value: require
      # The direct Neon endpoint has a real connection cap; 9 JVMs x Hikari
      # default pool of 10 would blow through it.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "3"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"
      # Public URLs of the other services (gateway routes + inter-service calls).
      - key: IDENTITY_SERVICE_URL
        value: https://tourflow-identity.onrender.com
      - key: CATALOG_SERVICE_URL
        value: https://tourflow-catalog.onrender.com
      - key: BOOKING_SERVICE_URL
        value: https://tourflow-booking.onrender.com
      - key: PAYMENT_SERVICE_URL
        value: https://tourflow-payment.onrender.com
      - key: MOBILITY_SERVICE_URL
        value: https://tourflow-mobility.onrender.com
      - key: ENGAGEMENT_SERVICE_URL
        value: https://tourflow-engagement.onrender.com
      - key: PLATFORM_SERVICE_URL
        value: https://tourflow-platform.onrender.com
      - key: INSIGHTS_SERVICE_URL
        value: https://tourflow-insights.onrender.com
      - key: SEARCH_SERVICE_URL
        value: https://tourflow-search.onrender.com
      # engagement-service and mobility-service read the catalog under these names.
      - key: BUSINESS_SERVICE_URL
        value: https://tourflow-catalog.onrender.com
      - key: TOUR_SERVICE_URL
        value: https://tourflow-catalog.onrender.com

services:
  - type: web
    name: tourflow-gateway
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerContext: .
    dockerfilePath: deploy/gateway/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: tourflow-shared

  - type: web
    name: tourflow-identity
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerContext: .
    dockerfilePath: deploy/identity-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: tourflow-shared

  - type: web
    name: tourflow-catalog
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerContext: .
    dockerfilePath: deploy/catalog-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: tourflow-shared

  - type: web
    name: tourflow-booking
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerContext: .
    dockerfilePath: deploy/booking-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: tourflow-shared

  - type: web
    name: tourflow-payment
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerContext: .
    dockerfilePath: deploy/payment-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: tourflow-shared
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - type: web
    name: tourflow-mobility
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerContext: .
    dockerfilePath: deploy/mobility-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: tourflow-shared

  - type: web
    name: tourflow-engagement
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerContext: .
    dockerfilePath: deploy/engagement-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: tourflow-shared

  - type: web
    name: tourflow-platform
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerContext: .
    dockerfilePath: deploy/platform-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: tourflow-shared

  - type: web
    name: tourflow-insights
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerContext: .
    dockerfilePath: deploy/insights-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: tourflow-shared

  - type: web
    name: tourflow-search
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerContext: .
    dockerfilePath: deploy/search-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: tourflow-shared
      # Phase 1 (no Kafka yet): the Elasticsearch index is only filled from
      # Kafka tour.events, so search would return nothing -- "catalog" filters
      # catalog-service tour list in memory instead. In Phase 2, change to
      # "elasticsearch" and add ELASTICSEARCH_URIS + SPRING_ELASTICSEARCH_APIKEY
      # by hand in the dashboard.
      - key: SEARCH_BACKEND
        value: catalog
      # Neither mode has a reachable Elasticsearch health endpoint (catalog mode:
      # none at all; Elastic Cloud serverless: HTTP 410), which would leave
      # /actuator/health DOWN and Render restart-looping this service.
      - key: MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED
        value: "false"
