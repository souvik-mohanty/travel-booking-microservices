global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # ==============================
  # TourFlow microservices
  # ==============================
  # Every service runs as a host JVM process, not inside a container (same as
  # how services reach Postgres via localhost:5432 and Kafka via
  # localhost:9094) -- so Prometheus, which itself runs inside Docker, must
  # reach them via host.docker.internal rather than localhost or a container
  # DNS name. All services expose Micrometer's Prometheus registry at
  # /actuator/prometheus (spring-boot-starter-actuator +
  # micrometer-registry-prometheus, with management.endpoints.web.exposure
  # already including "prometheus" in every service's application.yml).
  #
  # Backend was consolidated from 25 services down to 9 domain services + this
  # gateway (2026-09-06) -- see docs/decisions/ADR-002-SERVICE-CONSOLIDATION.md.
  - job_name: tourflow-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          service: api-gateway
      - targets:
          - host.docker.internal:8081
        labels:
          service: identity-service
      - targets:
          - host.docker.internal:8082
        labels:
          service: catalog-service
      - targets:
          - host.docker.internal:8083
        labels:
          service: booking-service
      - targets:
          - host.docker.internal:8084
        labels:
          service: payment-service
      - targets:
          - host.docker.internal:8086
        labels:
          service: mobility-service
      - targets:
          - host.docker.internal:8087
        labels:
          service: engagement-service
      - targets:
          - host.docker.internal:8088
        labels:
          service: platform-service
      - targets:
          - host.docker.internal:8089
        labels:
          service: insights-service
      - targets:
          - host.docker.internal:8099
        labels:
          service: search-service
