spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # A free-tier downstream service (see backend/deploy) can take up to
      # ~60s to cold-start on its first hit after 15 minutes idle -- the
      # default read-timeout is far shorter than that, so without this the
      # gateway would 504 long before a sleeping service finishes waking up.
      httpclient:
        connect-timeout: 5000
        read-timeout: 90000

      server:
        webmvc:
          # Every service is called by its full "/api/..." path as-is -- no
          # StripPrefix/RewritePath filters -- since each service's own
          # @RequestMapping already expects that full path (e.g. catalog-service
          # itself maps /api/tours/**). Routes are evaluated top-to-bottom and
          # the first matching one wins.
          #
          # Backend was consolidated from 25 services down to 9 domain services
          # + this gateway (2026-09-06) -- see docs/decisions/ADR-002-SERVICE-CONSOLIDATION.md.
          # The public "/api/..." surface below is unchanged from before the
          # consolidation; only the target ports moved as services merged.
          routes:
            # identity-service: identity + authorization + user, merged.
            - id: identity-service-auth
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: identity-service-admin
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/admin/users/**
            - id: identity-service-rbac
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/roles/**
            # Catches profile endpoints and the /api/users/{id}/roles|permissions
            # sub-paths alike -- both now live in identity-service, so unlike
            # before the merge, route order no longer matters here.
            - id: identity-service-users
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**
            # Google OAuth2 handshake. The browser starts the login and comes
            # back from Google through the gateway, so the session cookie
            # identity-service sets for the handshake is scoped to the gateway's
            # host on both legs (see OAUTH2_CALLBACK_BASE_URL in
            # application-oauth2.yml).
            - id: identity-service-oauth2
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/oauth2/**,/login/oauth2/**

            # catalog-service: tour + business + hotel + guide, merged.
            - id: catalog-service-tours
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/tours/**
            - id: catalog-service-businesses
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/businesses/**
            - id: catalog-service-activities
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/activities/**
            - id: catalog-service-hotels
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/hotels/**
            - id: catalog-service-rooms
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/rooms/**
            - id: catalog-service-guides
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/guides/**

            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/bookings/**

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/payments/**

            # mobility-service: driver + fleet + ride + trip + tracking, merged.
            - id: mobility-service-rides
              uri: ${MOBILITY_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/rides/**
            - id: mobility-service-ride-bookings
              uri: ${MOBILITY_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/ride-bookings/**
            - id: mobility-service-drivers
              uri: ${MOBILITY_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/drivers/**
            - id: mobility-service-vehicles
              uri: ${MOBILITY_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/vehicles/**
            - id: mobility-service-trips
              uri: ${MOBILITY_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/trips/**
            - id: mobility-service-tracking
              uri: ${MOBILITY_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/tracking/**

            # engagement-service: review + support, merged.
            - id: engagement-service-reviews
              uri: ${ENGAGEMENT_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/reviews/**
            - id: engagement-service-tickets
              uri: ${ENGAGEMENT_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/tickets/**

            # platform-service: notification + file, merged.
            - id: platform-service-notifications
              uri: ${PLATFORM_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/notifications/**
            - id: platform-service-files
              uri: ${PLATFORM_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/files/**

            # insights-service: audit + analytics, merged.
            - id: insights-service-analytics
              uri: ${INSIGHTS_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/analytics/**
            - id: insights-service-audit
              uri: ${INSIGHTS_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/audit-logs/**

            - id: search-service
              uri: ${SEARCH_SERVICE_URL:http://localhost:8099}
              predicates:
                - Path=/api/search/**

server:
  port: 8080

# Origins the frontend SPA may call this gateway from -- see CorsConfig.
# 3000 is vite.config.ts's configured port; 3001 is where it actually lands
# if something else already holds 3000; 5173 is Vite's own default if the
# port override is ever removed.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
