spring:
  application:
    name: identity-service

  datasource:
    # Identity Service (identity + authorization + user, merged 2026-09-06)
    # owns its own PostgreSQL schema -- previously the one service left on
    # the default "public" schema while every other service already used
    # its own; now consistent with the rest.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tour_planner}?currentSchema=identity_service&sslmode=${DB_SSLMODE:disable}&channelBinding=${DB_CHANNEL_BINDING:disable}
    username: ${DB_USERNAME:tour_user}
    password: ${DB_PASSWORD:tour_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Neon ignores the currentSchema URL parameter (Hibernate then looks in
      # "public" while Flyway created the tables in identity_service), so set the
      # search_path explicitly on every new connection.
      connection-init-sql: SET search_path TO identity_service

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: identity_service
    create-schemas: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

# Where to send the browser after a Google OAuth2 login completes (success or
# failure) -- normally the frontend's own callback route, e.g. /oauth2/redirect.
app:
  oauth2:
    authorized-redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}

  # Origins the frontend SPA may call this service from (see SecurityConfig's
  # CorsConfigurationSource). 3000 is vite.config.ts's configured port; 3001 is
  # where it actually lands if something else already holds 3000; 5173 is
  # Vite's own default if the port override is ever removed.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

# Google login (spring.security.oauth2.client.registration.google.*) lives in
# application-oauth2.yml instead of here. Spring Boot validates every OAuth2
# client registration at startup, so simply defaulting client-id to an empty
# string would crash the whole service for anyone running it locally without
# real Google credentials. Activate the "oauth2" profile once GOOGLE_CLIENT_ID /
# GOOGLE_CLIENT_SECRET are set (SPRING_PROFILES_ACTIVE=oauth2); SecurityConfig
# only wires up .oauth2Login(...) when a ClientRegistrationRepository bean
# actually exists, so plain email/password auth always works either way.

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

# JWT configuration
jwt:
  # Secret used to sign JWT tokens.
  secret: ${JWT_SECRET:tourflow-development-secret-key-must-be-at-least-32-bytes-long}

  # Access token lifetime: 15 minutes. Kept short because a leaked access token
  # can't be revoked (JWTs are stateless) -- it just has to expire quickly.
  expiration-ms: 900000

  # Refresh token lifetime: 30 days. Long-lived, but unlike the access token it
  # IS revocable (stored server-side, see RefreshTokenService) and is rotated
  # on every use, so a compromised one has a much smaller usable window.
  refresh-expiration-ms: 2592000000

# Enable detailed Spring Security logs for debugging.
logging:
  level:
    # Show which Spring Security filters process each request.
    org.springframework.security: DEBUG

    # Show web authorization decisions in detail.
    org.springframework.security.web.access: DEBUG