# Activate with SPRING_PROFILES_ACTIVE=oauth2 (or --spring.profiles.active=oauth2)
# once real Google OAuth2 credentials are available. See the comment in
# application.yml for why this lives in its own profile instead of the base config.
spring:
  security:
    oauth2:
      client:
        registration:
          # "google" here is the registrationId; Spring Security derives the
          # login-start URL /oauth2/authorization/google and callback URL
          # /login/oauth2/code/google from it automatically.
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # Where Google sends the browser back. The default ({baseUrl}) would
            # resolve to identity-service's OWN host, but the browser starts the
            # login at the api-gateway, so the handshake's session cookie
            # belongs to the gateway's host: the callback must return there too.
            # Locally that's the gateway on 8080; in production set
            # OAUTH2_CALLBACK_BASE_URL to the gateway's public URL. This exact
            # URL (base + /login/oauth2/code/google) must be listed under
            # "Authorized redirect URIs" for the OAuth client in Google Cloud.
            redirect-uri: ${OAUTH2_CALLBACK_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}
            scope:
              - openid
              - email
              - profile
