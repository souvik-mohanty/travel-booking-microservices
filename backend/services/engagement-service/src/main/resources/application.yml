server:
  port: 8087

spring:
  application:
    name: review-service

  datasource:
    # Review Service owns its own PostgreSQL schema.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tour_planner}?currentSchema=review_service
    username: ${DB_USERNAME:tour_user}
    password: ${DB_PASSWORD:tour_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: review_service
    create-schemas: true

  jpa:
    hibernate:
      # Flyway owns schema creation.
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

# Must match identity-service.
jwt:
  secret: ${JWT_SECRET:tourflow-development-secret-key-must-be-at-least-32-bytes-long}

services:
  booking:
    url: ${BOOKING_SERVICE_URL:http://localhost:8083}
  business:
    url: ${BUSINESS_SERVICE_URL:http://localhost:8086}
