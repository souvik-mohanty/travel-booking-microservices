spring:
  application:
    name: catalog-service

  datasource:
    # Catalog Service (tour + business + hotel + guide, merged 2026-09-06)
    # owns its own PostgreSQL schema. currentSchema sets this connection's
    # Postgres search_path, so every unqualified table name (Flyway's own
    # history table included) resolves inside catalog_service instead of
    # public -- keeps this service's schema and migration history independent
    # of identity-service's, even though both currently share the one
    # tour_planner database/Postgres instance.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tour_planner}?currentSchema=catalog_service
    username: ${DB_USERNAME:tour_user}
    password: ${DB_PASSWORD:tour_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: catalog_service
    # Creates the catalog_service schema on first run if it doesn't exist yet
    # -- nothing else (docker-compose, an init script) provisions it.
    create-schemas: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    # Port 9094 is Kafka's HOST listener (docker-compose.yml) -- advertised
    # as localhost, unlike the 9092 PLAINTEXT listener which is only
    # resolvable by other containers on tourflow-network.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# Origins the frontend SPA may call this service from (see SecurityConfig's
# CorsConfigurationSource). 3000 is vite.config.ts's configured port; 3001 is
# where it actually lands if something else already holds 3000; 5173 is
# Vite's own default if the port override is ever removed.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

# Must match the JWT secret used by identity-service, or JwtService here won't
# be able to verify tokens it issued.
jwt:
  # Override with JWT_SECRET in production instead of using this development value.
  secret: ${JWT_SECRET:tourflow-development-secret-key-must-be-at-least-32-bytes-long}
