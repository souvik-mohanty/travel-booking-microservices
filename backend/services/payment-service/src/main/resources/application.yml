server:
  port: 8084

spring:
  application:
    name: payment-service

  datasource:
    # Payment Service owns its own PostgreSQL schema.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tour_planner}?currentSchema=payment_service
    username: ${DB_USERNAME:tour_user}
    password: ${DB_PASSWORD:tour_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: payment_service
    create-schemas: true

  jpa:
    hibernate:
      # Flyway owns schema creation.
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

# Must match identity-service.
jwt:
  secret: ${JWT_SECRET:tourflow-development-secret-key-must-be-at-least-32-bytes-long}

services:
  booking:
    base-url: ${BOOKING_SERVICE_URL:http://localhost:8083}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  # Set once a webhook is configured in the Razorpay dashboard; the webhook
  # endpoint refuses requests until this is set.
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
