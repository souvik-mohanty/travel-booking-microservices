server:
  port: 8086

spring:
  application:
    name: mobility-service

  datasource:
    # Mobility Service (driver + fleet + ride + trip + tracking, merged
    # 2026-09-06) owns its own PostgreSQL schema.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tour_planner}?currentSchema=mobility_service
    username: ${DB_USERNAME:tour_user}
    password: ${DB_PASSWORD:tour_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: mobility_service
    create-schemas: true

  jpa:
    hibernate:
      # Flyway owns schema creation.
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

# Must match identity-service.
jwt:
  secret: ${JWT_SECRET:tourflow-development-secret-key-must-be-at-least-32-bytes-long}

services:
  booking:
    url: ${BOOKING_SERVICE_URL:http://localhost:8083}
  # tour-service was merged into catalog-service (port 8082) as part of the
  # 25->10 service consolidation.
  tour:
    url: ${TOUR_SERVICE_URL:http://localhost:8082}

# Origins the frontend SPA may call this service from (see SecurityConfig's
# CorsConfigurationSource). 3000 is vite.config.ts's configured port; 3001 is
# where it actually lands if something else already holds 3000; 5173 is
# Vite's own default if the port override is ever removed.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
