# Origins the frontend SPA may call this service from (see SecurityConfig's
# CorsConfigurationSource). 3000 is vite.config.ts's configured port; 3001 is
# where it actually lands if something else already holds 3000; 5173 is
# Vite's own default if the port override is ever removed.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

server:
  port: 8099

spring:
  application:
    name: search-service

  elasticsearch:
    # docker-compose.yml runs Elasticsearch with xpack.security.enabled=false,
    # so no credentials here -- plain HTTP to the host-published port, same
    # convention as reaching Postgres via localhost:5432 and Kafka via
    # localhost:9094 instead of the containers' network aliases.
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    # No api-key here on purpose: Boot only skips the Authorization header when
    # the value is null, so a blank default (${VAR:}) would send a bogus empty
    # "ApiKey " header to plain local Elasticsearch. Elastic Cloud sets it via
    # the SPRING_ELASTICSEARCH_APIKEY env var (Spring's own relaxed binding for
    # spring.elasticsearch.api-key) -- the base64 "encoded" key exactly as
    # Elastic Cloud displays it.

  kafka:
    # Port 9094 is Kafka's HOST listener (docker-compose.yml) -- advertised
    # as localhost, unlike the 9092 PLAINTEXT listener which is only
    # resolvable by other containers on tourflow-network.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: search-service

# "elasticsearch" (default) or "catalog" -- see TourSearchService. "catalog" is
# for deployments with no Elasticsearch; it also needs
# MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED=false or the ES health indicator
# will report DOWN forever.
search:
  backend: ${SEARCH_BACKEND:elasticsearch}

# Used only by CatalogFallbackTourSearchService (SEARCH_BACKEND=catalog): in
# production this is the core deployable's public Render URL (the API
# gateway), since catalog-service itself has no port exposed outside that
# container -- the gateway already proxies /api/tours/** to it. Locally it
# points straight at catalog-service.
services:
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

# Must match identity-service.
jwt:
  secret: ${JWT_SECRET:tourflow-development-secret-key-must-be-at-least-32-bytes-long}
