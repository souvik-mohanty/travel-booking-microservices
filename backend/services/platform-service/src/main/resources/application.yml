server:
  port: 8088

spring:
  application:
    name: platform-service

  kafka:
    # Port 9094 is Kafka's HOST listener (docker-compose.yml) -- advertised
    # as localhost, unlike the 9092 PLAINTEXT listener which is only
    # resolvable by other containers on tourflow-network.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: platform-service
    # PLAINTEXT/no-auth locally; the "render" deployment sets these to
    # SASL_SSL with managed-Kafka credentials (Aiven, Redpanda, ...), since it has no
    # unauthenticated Kafka listener to connect to (see KafkaConsumerConfig).
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    sasl:
      mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      jaas-config: ${KAFKA_SASL_JAAS_CONFIG:}

  datasource:
    # Platform Service (notification + file, merged 2026-09-06) owns its own
    # PostgreSQL schema.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tour_planner}?currentSchema=platform_service&sslmode=${DB_SSLMODE:disable}&channelBinding=${DB_CHANNEL_BINDING:disable}
    username: ${DB_USERNAME:tour_user}
    password: ${DB_PASSWORD:tour_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Neon ignores the currentSchema URL parameter (Hibernate then looks in
      # "public" while Flyway created the tables in platform_service), so set the
      # search_path explicitly on every new connection.
      connection-init-sql: SET search_path TO platform_service

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: platform_service
    create-schemas: true

  jpa:
    hibernate:
      # Flyway owns schema creation.
      ddl-auto: validate
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# Local disk stand-in for S3, which isn't provisioned in this project yet --
# same substitution pattern as local Postgres standing in for RDS.
file:
  storage-path: ${FILE_STORAGE_PATH:./uploads/platform-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

# Must match identity-service.
jwt:
  secret: ${JWT_SECRET:tourflow-development-secret-key-must-be-at-least-32-bytes-long}
