services:

  # ==============================
  # PostgreSQL
  # ==============================
  postgres:
    image: postgres:17-alpine
    container_name: tour-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Default max_connections (100) is too low for this project: every
    # service opens its own HikariCP pool against this one shared instance
    # (database-per-service via schema, not per-instance -- see
    # docs/architecture/SERVICE-BOUNDARIES.md), and running all of them
    # at once hit "FATAL: sorry, too many clients already" well before any
    # of them were individually near their own pool's max-pool-size. Kept
    # at 300 even after the 25->10 service consolidation (2026-09-06) since
    # it's a harmless ceiling, not a per-service allocation.
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tourflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==============================
  # Redis
  # ==============================
  redis:
    image: redis:8-alpine
    container_name: tour-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - tourflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==============================
  # Kafka
  # ==============================
  kafka:
    image: apache/kafka:4.0.0
    container_name: tour-kafka
    restart: unless-stopped
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two advertised listeners: PLAINTEXT (kafka:9092) for other containers
      # on tourflow-network (e.g. kafka-ui), HOST (localhost:9094) for
      # services running as host JVM processes -- every service in this repo
      # runs on the host, not in Docker, same as how they reach Postgres via
      # localhost:5432 rather than the postgres container's network alias.
      # Without this, a host process can complete the initial bootstrap
      # connection but then gets handed "kafka:9092" as the partition
      # leader's address, which the host can't resolve.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093,HOST://:9094
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - tourflow-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s


  # ==============================
  # Kafka UI
  # ==============================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tour-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: tour-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

      # kafka-ui gives full read/write/delete access to every topic
      # (including booking.events, which carries userId/price) with no auth
      # by default -- gate it behind a login form. Credentials live in .env,
      # same pattern as POSTGRES_USER/PASSWORD.
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USERNAME}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD}

      # Image defaults to DEBUG root logging, which is extremely noisy
      # (a metrics-poll log line every ~30s per cluster). The app's own
      # com.provectus.kafka.ui logger is set independently of root, so both
      # need to be raised.
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_PROVECTUS_KAFKA_UI: INFO
    ports:
      - "8085:8080"
    networks:
      - tourflow-network


  # ==============================
  # Elasticsearch
  # ==============================
  elasticsearch:
    # Pinned to match the co.elastic.clients:elasticsearch-java version that
    # Spring Boot 4.1.1's BOM resolves for spring-boot-starter-data-elasticsearch
    # (see search-service's pom.xml) -- a 9.x client against an 8.x server
    # fails hard (indices.exists comes back "status 400, Expecting a response
    # body, but none was sent") since Elastic doesn't support a client newer
    # than the server by a full major version. Keep this in lockstep with
    # whatever version Spring Boot's BOM manages next time it changes.
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.6
    container_name: tour-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - tourflow-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5


  # ==============================
  # Kibana
  # ==============================
  kibana:
    # Kept in lockstep with the elasticsearch service above -- Kibana must
    # match the Elasticsearch server's major.minor version.
    image: docker.elastic.co/kibana/kibana:9.4.6
    container_name: tour-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - tourflow-network


  # ==============================
  # Prometheus
  # ==============================
  prometheus:
    image: prom/prometheus:latest
    container_name: tour-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Every service is a host JVM process (not a container), so the
    # tourflow-services scrape job in prometheus.yml targets
    # host.docker.internal:<port>. Docker Desktop resolves that automatically;
    # this extra_hosts entry makes it resolve on Linux Docker too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tourflow-network


  # ==============================
  # Grafana
  # ==============================
  grafana:
    image: grafana/grafana:latest
    container_name: tour-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      # Host port 3000 is reserved for the frontend dev server (and matches
      # identity-service's default app.oauth2.authorized-redirect-uri) --
      # Grafana moves to 3030 instead of colliding with it.
      - "3030:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # Provisions the Prometheus datasource and the TourFlow Services
      # dashboard automatically on startup -- see
      # config/grafana/provisioning/{datasources,dashboards} and
      # config/grafana/dashboards.
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - tourflow-network


# ==============================
# Volumes
# ==============================

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  elasticsearch-data:
  prometheus-data:
  grafana-data:


# ==============================
# Network
# ==============================

networks:
  tourflow-network:
    name: tourflow-network
    driver: bridge
