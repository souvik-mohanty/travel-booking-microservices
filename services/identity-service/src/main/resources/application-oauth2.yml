# Activate with SPRING_PROFILES_ACTIVE=oauth2 (or --spring.profiles.active=oauth2)
# once real Google OAuth2 credentials are available. See the comment in
# application.yml for why this lives in its own profile instead of the base config.
spring:
  security:
    oauth2:
      client:
        registration:
          # "google" here is the registrationId; Spring Security derives the
          # login-start URL /oauth2/authorization/google and callback URL
          # /login/oauth2/code/google from it automatically.
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
